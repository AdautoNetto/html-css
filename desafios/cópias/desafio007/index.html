<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Result</title>
    <link rel="shortcut icon" href="imagens/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media.css">
</head>
<body>
    <main>
        <article>
            <header>
                <h3>Your Result</h3>

                <div id="pontos">
                    <p id="maior">76</p>
                    <P id="menor">of 100</P>
                </div>

                <h2>Great</h2>

                <p>You scored higher than 65% of the people who have taken these tests.</p>
            </header>

            <section class="conteudo">
                <h3>Summary</h3>

                <div class="seções">
                    <a href="#" id="reação">
                        <div id="ladoesquerdo">
                            <img src="imagens/icon-reaction.svg" alt="Reaction" class="icone">

                            <span class="nome">Reaction</span>
                        </div>

                        <div id="ladodireito">
                            <strong>80</strong>

                            <span class="total">/ 100</span>
                        </div>
                    </a>

                    <a href="#" id="memoria">
                        <div id="ladoesquerdo">
                                <img src="imagens/icon-memory.svg" alt="memoria" class="icone">

                            <span class="nome">Memory</span>
                        </div>

                        <div id="ladodireito">
                            <strong>92</strong>

                            <span class="total">/ 100</span>
                        </div>
                    </a>

                    <a href="#" id="verbal">
                        <div id="ladoesquerdo">
                            <img src="imagens/icon-verbal.svg" alt="verbal" class="icone">
        
                            <span class="nome">Verbal</span>
                        </div>

                        <div id="ladodireito">
                            <strong>61</strong>

                            <span class="total">/ 100</span>
                        </div>
                    </a>

                    <a href="#" id="visual">
                        <div id="ladoesquerdo">
                            <img src="imagens/icon-visual.svg" alt="visual" class="icone">

                            <span class="nome"> Visual</span>
                        </div>

                        <div id="ladodireito">
                            <strong>73</strong>
                            <span class="total">/ 100</span>
                        </div>
                    </a>
                </div>

                <a href="#">Continue</a>
            </section>
        </article>
    </main>
</body>
</html>
