<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<style>
    *{
        padding: 0px;
        margin: 0px;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background-color: #f4f4f9;
    }
    
    header{
        background-color: black;
        height: 200px;
        box-shadow: 1px 1px black;
    }

    header h1{
     color: white;
     text-align: center;
     padding-top: 70px;
     text-shadow: 1px 1px rgba(255, 255, 255, 0.562);
    }
    header h2{
        text-align: center;
        color: white;
        padding: 10px;
        text-shadow: 1px 1px rgba(255, 255, 255, 0.562);
    }
    article h1{
        text-align: center;
        padding-top: 60px;
        text-shadow: 1px 1px rgba(0, 0, 0, 0.603);
    }
    section{
        max-width: 40%;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    fieldset{
        margin-top: 50px;
        padding: 20px;
        background-color: white;
        border: 1.5px solid black ;
        box-shadow: 2px 1px 5px rgba(0, 0, 0, 0.281);
        border-radius: 10px;
    }
    legend{
        text-align: center;
    }

    div.cadastro {
        margin-top: 20px;
    }

    div.cadastro#sexo{
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
    }

    div.cadastro#objetivo {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
    }

    div.cadastro#plano select{
        width: 130px;
        height: 25px;
        margin-top: 5px;
    }

    div.cadastro#enviar {
        text-align: center;
    }

    div.cadastro#enviar input{
        height: 40px;
        width: 110px;
        margin:10px 20px 10px 20px;
    }

    input{
        height: 24px;
    }
</style>
<body>
    <header>
        <h1>Cadastro para academia</h1>
        <h2>10 Segundos</h2>
    </header>
    <main>
        <article>
            <h1>Cadastro Novo Aluno</h1>
            <section>
                <form action="cadastro.php" method="post" autocomplete="on">
                    <fieldset>
                        <legend>Cadastro novo aluno</legend>
                        <div class="cadastro">
                            <label for="inome">Nome completo: </label>
                            <input type="text" name="nome" id="inome" placeholder=" Digite o seu nome" size="45px"> <br>
                        </div>

                        <div class="cadastro">
                            <label for="iemail">E-mail: </label>
                            <input type="email" name="email" id="iemail" placeholder=" Digite o seu Email" size="45px">
                        </div>

                        <div class="cadastro">
                            <label for="icpf">CPF: </label>
                            <input type="text" name="cpf" id="icpf" placeholder="xxx.xxx.xxx-xx" size="15px">
                        </div>

                        <div class="cadastro">
                            <label for="inasc">Data de nascimento: </label>
                            <input type="date" name="nascimento" id="inasc">
                        </div>

                        <div class="cadastro">
                            <label for="inum">Celular: </label>
                            <input type="number" name="numero" id="inum" placeholder="xx xxxxx xxxx">
                        </div>

                        <div class="cadastro" id="sexo">
                            <p>Sexo: </p> <br>
                            <input type="radio" name="sexo" id="imasc" value="M">
                            <label for="imasc">Masculino </label> <br>
                            
                            <input type="radio" name="sexo" id="ifem">
                            <label for="ifem">Feminino </label> <br>
                            
                            <input type="radio" name="sexo" id="ioutro">
                            <label for="ioutro">Outros </label>
                        </div>
                        
                        <div class="cadastro" id="objetivo">
                            <p>Objetivo desejado: </p> <br>
                            <input type="checkbox" name="hipertrofia" id="ihiper">
                            <label for="ihiper">Hipertrofia</label> 

                            <input type="checkbox" name="emagrecimento" id="iema">
                            <label for="iema">Emagrecimento</label>

                            <input type="checkbox" name="saude" id="isaude">
                            <label for="isaude">Saúde</label>
                        </div>

                        <div class="cadastro" id="plano">
                            <p>Plano desejado:</p>
                            <select name="plano" id="iplano">
                                <option value="mensal">Mensal</option>
                                <option value="trimestral">Trimestral</option>
                                <option value="anual">Anual</option>
                            </select>
                        </div>

                        <div class="cadastro" id="medicos">
                           <p>Restrições médicas:</p> 
                           <textarea name="medico" id="medico" rows="5" cols="55"></textarea>
                        </div>

                        <div class="cadastro" id="enviar">
                            <input type="submit" value="Cadastrar aluno">

                            <input type="reset" value="Limpar">
                        </div>
                    </fieldset>
                </form>
            </section>
        </article>
    </main>
    
</body>
</html>
