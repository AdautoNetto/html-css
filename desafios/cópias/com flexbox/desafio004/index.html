<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio004 - FlexBox</title>
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
      <main>
          <div class="resultado">
            <p class="seu">
                Your Result
            </p>

            <div class="circulo">
                <p class="grande">76</p>
                <p class="pequeno">of 100</p>
            </div>
              
            <p class="otima">Great</p>

            <p class="descricao">
                You scored higher than 65% of the people who have taken these tests.
            </p>
          </div>
            
            <div class="resumo">
                <p class="sum">Summary</p>
                
                <div class="materias">

                    <div class="reacao">
                        <img src="images/icon-reaction.svg" alt="reaction">

                        <p class="materia">Reaction</p>

                        <p class="resultado">80 / 100</p>
                    </div>

                    <div class="memoria">
                        <img src="images/icon-memory.svg" alt="memoria">

                        <p class="materia">Memory</p>

                        <p class="resultado">92 / 100</p>
                    </div>

                    <div class="verbal">
                        <img src="images/icon-verbal.svg" alt="verbal">

                        <p class="materia">Verbal</p>

                        <p class="resultado">61 / 100</p>
                    </div>

                    <div class="visual">
                        <img src="images/icon-visual.svg" alt="visual">

                        <p class="materia">Visual</p>

                        <p class="resultado">72 / 100</p>
                    </div>
                </div>

                <a href="#">Continue</a>
            </div>
      </main>

</body>
</html>
